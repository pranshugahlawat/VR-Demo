  constructor(seed=1337){

  }
  dot(g,x,y){return g[0]*x+g[1]*y;}
  noise2D(xin,yin){
    const F2=0.5*(Math.sqrt(3)-1),s=(xin+yin)*F2,i=Math.floor(xin+s),j=Math.floor(yin+s),G2=(3-Math.sqrt(3))/6,t=(i+j)*G2,X0=i-t,Y0=j-t,x0=xin-X0,y0=yin-Y0;let i1,j1;x0>y0?(i1=1,j1=0):(i1=0,j1=1);

    let t1=0.5-x1*x1-y1*y1;if(t1>=0){t1*=t1;n1=t1*t1*this.dot(this.grad3[gi1],x1,y1);}
    let t2=0.5-x2*x2-y2*y2;if(t2>=0){t2*=t2;n2=t2*t2*this.dot(this.grad3[gi2],x2,y2);}
    return 70*(n0+n1+n2);
  }
